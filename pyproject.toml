[project]
name = "eupkgs-scripts"
version = "0.0.0"
description = "Scripts for the eupkgs flake"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.27.0",
    "rich>=15.0.0",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "ty>=0.0.65",
    "ruff>=0.16.1",
]

[tool.uv]
package = false

[tool.ty.environment]
root = ["./scripts"]

[tool.ty.src]
include = ["scripts", "tests"]

[tool.ruff]
line-length = 100
src = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["_common"]
