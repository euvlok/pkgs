name: Python checks

on:
  push:
    branches: [master]
    paths:
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/python-checks.yaml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/python-checks.yaml"

permissions:
  contents: read

jobs:
  check:
    name: ty + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Sync dev dependencies
        run: uv sync --locked

      - name: ty
        run: uv run --locked ty check

      - name: ruff format
        run: uv run --locked ruff format --check scripts/ tests/

      - name: ruff
        run: uv run --locked ruff check scripts/ tests/

      - name: Unit tests
        run: PYTHONPATH=scripts uv run --locked python3 -m unittest discover -s tests

      - name: Compile with Python 3
        run: uv run --locked python3 -m compileall -q scripts/ tests/
