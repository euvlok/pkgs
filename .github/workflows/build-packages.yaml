name: Build Packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Package names to build, separated by commas or whitespace. Use 'all' explicitly for a full build."
        required: false
        default: ""
  push:
    branches: [master]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "default.nix"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".github/actions/setup-bun/**"
      - "pkgs/**"
      - ".github/actions/setup-nix/action.yml"
      - ".github/workflows/build-packages.yaml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "default.nix"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".github/actions/setup-bun/**"
      - "pkgs/**"
      - ".github/actions/setup-nix/action.yml"
      - ".github/workflows/build-packages.yaml"

permissions:
  contents: read

concurrency:
  group: build-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-packages:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
      has_packages: ${{ steps.detect.outputs.has_packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Detect packages
        id: detect
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PACKAGES: ${{ github.event.inputs.packages || '' }}
        run: bun ./scripts/changed-packages/changed-packages.ts --packages "$PACKAGES"

  flake-check:
    name: Check flake evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE_NAME || 'eupkgs' }}

      - name: Check flake outputs without building packages
        run: nix flake check --accept-flake-config --impure --no-build

  build-packages:
    name: Build Packages (${{ matrix.platform }})
    needs: detect-packages
    if: needs.detect-packages.outputs.has_packages == 'true'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runs-on: ubuntu-latest
          - platform: darwin
            runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE_NAME || 'eupkgs' }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-skip-push: ${{ github.event_name == 'pull_request' }}

      - uses: ./.github/actions/setup-bun

      - name: Build selected by-name packages
        shell: bash
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
          PACKAGES_JSON: ${{ needs.detect-packages.outputs.packages }}
        run: bun ./scripts/build-packages/build-packages.ts
